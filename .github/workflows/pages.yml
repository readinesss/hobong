# 기본 브랜치에 푸시되면 단일 HTML을 GitHub Pages에 올린다.
#
# 처음 한 번은 저장소 관리자가 켜야 한다.
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 꺼져 있으면 이 워크플로는 실패하지 않고 안내만 남긴 뒤 끝난다.
name: Pages 배포

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    name: Pages 설정 확인
    # 기본 브랜치에서만 배포한다(브랜치 이름이 바뀌어도 그대로 따라간다).
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=""
          if json="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>probe.err)"; then
            build_type="$(jq -r '.build_type // empty' <<<"$json")"
          else
            # 404 면 Pages 를 쓰지 않는 저장소다. 다른 오류라면 원인을 남긴다.
            cat probe.err
          fi
          if [ "$build_type" = "workflow" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages 배포를 건너뜁니다::Settings → Pages → Source 를 'GitHub Actions'로 바꾸면 다음 푸시부터 배포됩니다. (현재: ${build_type:-사용 안 함})"
          fi

  build:
    name: 빌드
    needs: probe
    if: ${{ needs.probe.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # 배포 전에 한 번 더 확인한다: 계산이 틀린 채로 나가면 안 된다.
      - run: npm test

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
