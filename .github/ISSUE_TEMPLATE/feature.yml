name: 기능 제안
description: 이런 게 있으면 더 자주 열어볼 것 같아요
title: '[제안] '
labels: ['기능 제안']
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 점이 아쉬웠나요?
      description: 기능보다 먼저, 어떤 상황에서 무엇이 불편했는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 이렇게 되면 좋겠어요
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 어느 쪽에 가까운가요?
      options:
        - 계산·규정(직종, 수당 등)
        - 연가 관리
        - 캐릭터·뱃지·카드
        - 화면·사용성·접근성
        - 데이터 내려받기·불러오기
        - 그 밖의 것
    validations:
      required: false
  - type: checkboxes
    id: principles
    attributes:
      label: 지키는 원칙
      description: 아래 원칙과 부딪히는 제안은 받아들이기 어렵습니다.
      options:
        - label: 서버 없이, 외부로 아무것도 보내지 않고도 되는 기능입니다.
        - label: 실명·소속 같은 개인정보를 모으지 않아도 되는 기능입니다.
